version: '3.8'

services:
   mysql:
     image: mariadb
     command: --default-authentication-plugin=mysql_native_password
     environment:
       MYSQL_ROOT_PASSWORD: Abc123!
       MYSQL_DATABASE: php
       MYSQL_USER: php
       MYSQL_PASSWORD: 4linux

   memcached:
     image: memcached:alpine

   app:
     depends_on:
     - mysql
     image: radiofer/php-login
     ports:
     - "8282:80"
     environment:
       DB_HOST: mysql
       DB_PORT: 3306
       DB_USER: php
       DB_PASS: 4linux
       DB_NAME: php
